<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02 造出来 · 心灵空间</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="builder.css"></head><body><header><a href="index.html">← 方向列表</a><h1>我的小世界 <span>BUILD MODE / 02</span></h1><button id="builder-checkin">今天来过 ＋3</button><button id="budget-toggle">✦ <b id="builder-balance">80</b> 糕点 <span>演示</span></button></header><main><aside class="catalog"><div class="catalog-title">选择，再摆放</div><button class="catalog-item" data-kind="chair"><img src="assets/build-chair.webp" alt="俯视阅读椅"><b>阅读椅</b><small>演示 8 糕点</small></button><button class="catalog-item" data-kind="plant"><img src="assets/build-plant.webp" alt="俯视植物"><b>绿意</b><small>演示 3 糕点</small></button><button class="catalog-item record" data-kind="note"><span>＋</span><b>今日记录</b><small>写下来，放进房间</small></button><div class="catalog-foot">这里的物件由你选择位置。<br>记录没有价格，成长不按消费计分。</div></aside><section class="build-workspace"><div class="canvas-top"><span id="build-status">选择左边的物件，移动鼠标预览位置。</span><div><button id="builder-grid">吸附：开</button><button id="builder-undo" disabled>撤销</button></div></div><div class="floor-wrap"><div id="build-floor" tabindex="0" aria-label="布置画布，选择物件后用方向键移动预览，Enter 放置"><img class="floor" src="assets/build-room.webp" alt="俯视房间平面"><div class="build-grid"></div><div id="build-items"></div><div id="ghost" hidden></div><div id="corner-label" hidden>✦ 一个人的阅读角</div></div></div><div class="canvas-bottom"><span id="builder-count">0 件物品</span><span>拖动重新布置 · R 旋转 · Esc 取消 · 方向键微调</span><span id="builder-save">仅在此浏览器保存</span></div></section><aside class="inspector"><div class="inspector-title">物件旁边的工具</div><div id="inspect-content"><h2>从一把椅子开始。</h2><p>把绿植靠近椅子，会组成一个阅读角。这个组合只改变空间，不给你的成长打分。</p></div><div class="budget-sheet" id="budget-sheet" hidden><h2>造一个家的小账本</h2><div id="build-ledger"></div><p>所有价格与余额均为演示。真实系统需在服务端检查物品归属、余额与请求幂等。</p></div></aside></main><script src="world-core.js"></script><script src="builder.js"></script></body></html>
