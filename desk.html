<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>03 拿起来 · 我的记忆桌</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="desk.css"></head><body><div class="desk-scene"></div><a class="desk-back" href="index.html">← 方向列表</a><div class="desk-title"><span>03 / HANDLE & KEEP</span><h1>把今天，夹进生活。</h1></div>
<button id="paper-stack" aria-label="抽出一张空白纸"><span>空白纸笺</span><small>抽出一张</small></button>
<button id="closed-journal"><span>那些来过的日子</span><small>翻开手账</small></button>
<section id="open-journal" hidden><div class="journal-spread"><div class="journal-left"><span>THE DAYS I KEPT</span><h2>慢慢翻，<br>都是自己的日子。</h2><button id="close-journal">合上手账</button></div><article class="journal-page" id="journal-page"><div id="journal-entry"></div><div class="page-controls"><button id="previous-page">上一页</button><small id="page-count"></small><button id="next-page">下一页</button></div></article></div></section>
<section id="loose-paper" hidden aria-label="正在拿着的纸笺"><div class="paper-grip" id="paper-grip"><span>这张纸，拿在手里</span><small>拖动这里可以挪位置</small></div><div class="paper-open"><div class="paper-date" id="paper-date">还没盖日期章</div><textarea id="letter-text" maxlength="350" placeholder="想给以后的自己，留一句什么话？"></textarea><div id="date-stamp" hidden>今天<br>来过</div><div class="paper-actions"><button id="stamp-paper">盖今天的章</button><button id="fold-paper">先折起来</button><button id="tuck-paper">夹进手账</button></div><small id="paper-status">只在你选择收好时保存为一段经历</small></div><button class="folded-face" id="unfold-paper"><span>给以后的自己</span><small>展开这封信</small></button></section>
<div class="drawer-unit"><button id="drawer-handle">拉开抽屉 <span>⌄</span></button><div id="drawer-tray"><div class="drawer-label">收好的信件</div><div id="drawer-letters"></div><button id="close-drawer">推回抽屉</button></div></div>
<div class="receipt-pocket"><button id="pull-receipt">抽出糕点收据</button><section id="receipt" hidden><div class="receipt-head">GAODIAN<br><small>演示小账 · 非真实资产</small></div><div class="receipt-balance" id="receipt-balance"></div><div id="receipt-lines"></div><p>不单独售卖，不兑现现金<br>你的经历不会因消费而减少</p><button id="put-receipt">收回口袋</button></section></div><div class="desk-instruction" id="desk-instruction">抽出纸笺 → 写在纸上 → 盖章 → 夹进手账。也可以先折起来。</div><div class="desk-local">桌面交互实验 · 本地保存 · 无真实扣费</div><script src="world-core.js"></script><script src="desk.js"></script></body></html>
