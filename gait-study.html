<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心灵空间 · 走路动作样片</title><link rel="icon" href="favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#192927;color:#f4edda;font-family:'PingFang SC',sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:24px 5vw}h1{font-size:23px;font-weight:500;margin:0}a{color:#dfceac;font-size:14px}main{width:min(1200px,94vw);margin:auto}.stages{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stage{border:1px solid #c8d2b52b;border-radius:24px;overflow:hidden;background:#9da991;position:relative}.stage h2{position:absolute;top:12px;left:20px;font-size:15px;color:#263e35;font-weight:500}.stage canvas{width:100%;display:block;aspect-ratio:1.05}.controls{display:flex;justify-content:center;align-items:center;gap:14px;padding:25px;flex-wrap:wrap}button,select{font:inherit;color:#f1e6c9;background:#ffffff0a;border:1px solid #dcd6b640;border-radius:22px;padding:10px 18px;cursor:pointer}option{background:#21352c}label{font-size:14px}p{font-size:14px;line-height:1.9;color:#d1d1bc;text-align:center;margin:5px auto;max-width:750px}input[type=range]{display:block;width:min(650px,88%);margin:10px auto;accent-color:#edd6a4}.legend{font-size:13px;opacity:.8;padding-bottom:25px}@media(max-width:700px){.stages{grid-template-columns:1fr}h1{font-size:18px}}:focus-visible{outline:2px solid #fff1aa;outline-offset:4px}</style></head><body><header><h1>走路动作样片</h1><a href="index.html">回到心灵空间</a></header><main><div class="stages"><section class="stage"><h2>正向步态 · 看承重与屈膝</h2><canvas id="gait-front" width="630" height="600"></canvas></section><section class="stage"><h2>斜向 · 看迈步与落脚</h2><canvas id="gait-angle" width="630" height="600"></canvas></section></div><div class="controls"><button id="gait-play">暂停</button><button id="gait-step">下一帧</button><label>速度 <select id="gait-speed"><option value="1">正常</option><option value="0.4">慢放 0.4×</option></select></label><label><input id="gait-bones" type="checkbox"> 显示关节与落脚点</label></div><input id="gait-time" aria-label="逐帧查看一个步态周期" type="range" min="0" max="1000" value="0"><p id="gait-phase"></p><p class="legend">先检查脚掌、膝盖和身体重心。这是二维网格动作实验；两个窗口比较正向与斜向的步态投影，角色角度美术还未分别重绘。</p></main><script src="gait-mesh.js"></script><script src="gait-study.js"></script></body></html>
