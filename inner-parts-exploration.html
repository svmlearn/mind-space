<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心灵空间 · 在这里，慢慢成为自己</title><meta name="description" content="一个属于自己的内在空间。交谈留下自传，窗边回看来路，星图望向未来。"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="inner-home.css"><link rel="stylesheet" href="inner-parts.css"></head><body>
<main id="sanctuary"><img class="sanctuary-art" src="assets/inner/sanctuary.webp" alt="暮光照进一处柔和的私人心灵空间"><div class="shade"></div><div id="furniture" hidden></div><button id="inner-self" aria-label="看看另一个自己"><img id="self-resting" src="assets/inner/self-resting.webp" alt="安静坐着的另一个自己"><img id="self-open" src="assets/inner/self-open.webp" alt="舒展站立的同一个自己"><span id="self-name"></span></button><div id="memory-objects"></div><div class="self-whisper"><p id="whisper"></p><button id="whisper-source">这句话从哪里来</button></div><section id="inner-parts" aria-label="一段经历中的内在角色">
<div class="scene-intro"><span>一段经历 · 虚构演示</span><h1>想说的话，终于有了位置。</h1><p id="scene-line"></p></div>
<div id="parts-cast"><button class="part part-soft" data-part="0"><span class="part-art"><img src="assets/inner/ensemble.webp" alt="披着柔软蓝紫外衣的小小角色"></span><span class="part-name">想被接住的我</span></button><button class="part part-bold" data-part="1"><span class="part-art"><img src="assets/inner/ensemble.webp" alt="抱着折纸护盾的暖色小角色"></span><span class="part-name">想争取的我</span></button><button class="part part-free" data-part="2"><span class="part-art"><img src="assets/inner/ensemble.webp" alt="托着微光的自在小角色"></span><span class="part-name">能安心的我</span></button></div>
<button id="inner-voice" aria-label="听见这个内在要求"><span class="voice-label">一个要求自己的声音</span><span id="voice-words"></span></button>
<div id="part-detail" hidden><button id="part-detail-close" aria-label="收起角色说明">×</button><small id="part-kind"></small><p id="part-words"></p><span id="part-behavior"></span></div>
<div class="coordination"><p id="coordination-line"></p><button id="coordinate-action"></button><button id="scene-evidence">这来自哪段经历？</button></div>
<div class="scene-stages" aria-label="回看这段经历"><button data-stage="0">那一次，没说出口</button><span></span><button data-stage="1">开始试着表达</button><span></span><button data-stage="2">这一次，留在对话里</button></div>
</section><div id="unsynced-space" hidden><p>这里先留一点空白。</p><small>外部对话还没有接入，空间不会替你编造内在角色。</small><button id="show-scene-demo">看看一段虚构场景</button></div></main>
<header><span class="brand">心灵空间</span><span id="today"></span><button id="mode" title="切换示例档案与自己的空白空间"></button></header><div class="top-corner"><button id="light" aria-label="切换暮色与夜色" title="灯光">☼</button><a href="character-styles.html" class="styles-link">角色造型对照</a><button id="about-open" aria-label="原型说明" title="原型说明">i</button></div>
<div id="moment-picker"><button data-moment="then">那时</button><span></span><button data-moment="now" class="active">此刻</button><span></span><button data-moment="toward">向往</button></div><p id="moment-caption"></p>
<nav class="quiet-dock" aria-label="空间里的物件"><button data-open="book" aria-label="翻开我的自传"><svg viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"/></svg><span>我的自传</span></button><button data-open="journey" aria-label="到窗边回看来时路"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="5"/><path d="M3 15h18M9 4v11"/></svg><span>来时路</span></button><button data-open="map" aria-label="展开我的路书"><svg viewBox="0 0 24 24"><path d="m4 17 6-10 10 6M10 7l6-4"/><circle cx="4" cy="17" r="2"/><circle cx="10" cy="7" r="2"/><circle cx="20" cy="13" r="2"/></svg><span>我的路书</span></button><button hidden id="decorate" aria-label="布置属于自己的空间" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 12V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v5M4 12h16v7H4Zm2 7v3m12-3v3"/></svg><span>布置空间</span></button></nav>
<section id="conversation" hidden><button id="chat-handle" aria-expanded="false"><span class="breath-dot"></span><span>想说点什么，就说吧。</span><span class="handle-mark">⌃</span></button><div id="chat-room" hidden><div class="chat-heading"><span>和空间聊一会儿</span><small>本地交互演示 · 未接真实 AI</small></div><div id="messages" aria-live="polite"></div><div id="conversation-examples"><button data-prompt="idea">聊聊今天的一小步</button><button data-prompt="future">说一个未来的想法</button><button data-prompt="pause">今天只想坐一会儿</button></div><form id="chat-form"><label class="sr" for="chat-input">想对空间说的话</label><textarea id="chat-input" rows="2" maxlength="1200" placeholder="不用先整理好，也不用填写一份表格。"></textarea><button type="submit" aria-label="发送这段话">送出</button></form><p class="chat-boundary">示例话题展示自动整理的效果；自由输入先保留原话，可在自传中纠正或收起。</p></div></section>
<aside id="decor-tray" hidden><span>挪到你喜欢的地方</span><button data-add="chair">添一把椅子</button><button data-add="plant">添一盆绿意</button><button id="decor-done">布置好了</button><small>拖动物件 · 方向键微调 · 仅演示，不扣费</small></aside><div id="object-controls" hidden><button id="object-flip" aria-label="调转物件朝向">↔</button><button id="object-less" aria-label="缩小物件">−</button><button id="object-more" aria-label="放大物件">＋</button><button id="object-store">收起</button></div>
<div id="notice" role="status"></div><footer>桌面交互原型 · 内容仅保存在此浏览器</footer>
<dialog id="viewer"><button id="return-home" aria-label="合上，回到我的空间">‹ <span>回到我的空间</span></button><div id="view-content"></div><aside id="source-panel" hidden><button id="source-close" aria-label="收起这段记录">×</button><div id="source-content"></div></aside></dialog><script src="inner-home.js"></script><script src="inner-parts.js" defer></script><dialog id="scene-reader"><button id="scene-reader-close" aria-label="回到场景">合上</button><div id="scene-reading"></div></dialog></body></html>
