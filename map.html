<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04 走近 · 经历地图</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="map.css"></head><body><header><a href="index.html">← 方向列表</a><div><h1>我的经历地图</h1><span>04 / NAVIGATE & DISCOVER</span></div><p>远看关系，走近一段经历。地图不会替你解释自己。</p></header><div id="map-viewport"><div id="map-world"><svg id="map-lines" width="2500" height="1800" aria-hidden="true"></svg><div id="map-clusters"></div><div id="map-nodes"></div><section id="resource-zone"><button class="resource-head" id="go-resource"><small>RESOURCE REGION</small><h2>糕点补给站</h2><strong id="map-balance"></strong><span>演示余额</span></button><div class="resource-mid"><div><span>获得</span><b id="map-earned"></b></div><div><span>消费</span><b id="map-spent"></b></div></div><div id="resource-ledger"></div><p class="near-only">不单独售卖，不兑现现金。这里展示事实账目，不把花费等同于成长。</p></section><section id="arrival-zone"><small>TODAY'S COORDINATE</small><h2>今天来过</h2><button id="map-checkin">在这里标记今天 ＋3</button><p>每天一次 · 演示规则</p></section><section id="map-composer" hidden><div class="composer-head"><span>在这个位置留下经历</span><button id="cancel-node" aria-label="取消">×</button></div><form id="node-form"><label for="node-topic">由你选择它属于哪里</label><select id="node-topic"><option>尝试</option><option>日常</option><option>想法</option></select><textarea id="node-text" maxlength="250" required placeholder="写下一件发生过的事……"></textarea><button type="submit">把它种在这里</button></form></section></div></div><nav class="map-zoom"><button id="zoom-minus" aria-label="缩小">−</button><output id="zoom-number">48%</output><button id="zoom-plus" aria-label="放大">＋</button><i></i><button id="map-home">回到全景</button><button id="find-account">去补给站</button></nav><div class="semantic-steps"><button data-level="far" class="active">01 远看主题</button><span>—</span><button data-level="mid">02 走近节点</button><span>—</span><button data-level="near">03 读到原文</button></div><button class="add-node" id="new-node">＋ 留下一个新坐标</button><div class="map-instructions" id="map-instructions">拖动空白漫游 · 滚轮缩放 · 双击空白创建节点 · 层级变化会展示不同内容</div><script src="world-core.js"></script><script src="map.js"></script></body></html>
