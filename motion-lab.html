<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心灵空间 · 动作小样</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="motion-lab.css"><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script></head><body>
<header><a href="./">回到心灵空间</a><span>动作小样</span><nav aria-label="选择样片"><button data-mode="seat" aria-pressed="true">坐一会儿</button><button data-mode="walk" aria-pressed="false">去走走</button></nav></header>
<main><section id="seat-panel"><div class="scene" id="seat-scene"><canvas id="seat-canvas" width="1672" height="941" aria-label="分层人物的侧头微笑与挥手动作"></canvas><p id="seat-status" role="status">正在准备人物…</p></div><div class="controls"><button id="smile">侧头笑一笑</button><button id="wave">挥挥手</button><button id="sequence">完整演示</button><button id="seat-pause" aria-pressed="false">暂停</button><label><input id="checker" type="checkbox"> 查看透明分层</label><label>动作进度 <input id="seat-time" type="range" min="0" max="10" step=".02" value="0"></label></div><p class="note">头、身体和手臂独立运动。拖动进度，可以停在中间姿势观察连接处。</p></section>
<section id="walk-panel" hidden><div class="scene" id="walk-scene"><div id="walk-stage"></div><video id="walk-video" poster="assets/motion-lab/walk-poster.png" controls playsinline preload="metadata" hidden></video><p id="walk-status" role="status">正在准备行走样片…</p><span class="scene-label">3D 动作样机 · 造型待确认</span></div><div class="controls"><button id="walk-replay">重新走一遍</button><button id="walk-pause" aria-pressed="false">暂停</button><label>速度 <select id="walk-speed"><option value="1">正常</option><option value="0.5">慢放</option></select></label><label><input id="ground-grid" type="checkbox" checked> 地面参照</label><label>动作进度 <input id="walk-time" type="range" min="0" max="1" step=".01" value="0"></label></div><p class="note">观察起步、支撑脚、转向和停步。本页先验证动作；主页暂未替换。</p></section></main>
<script src="seated-rig.js"></script><script src="motion-lab.js"></script><script type="module" src="motion-lab-3d.js"></script></body></html>
