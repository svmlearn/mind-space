<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>01 住进去 · 心灵空间</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="room.css"></head><body><div id="room-view"><div id="room-world"><img class="architecture" src="assets/room.webp" alt="暖光里的私人房间"><img class="armchair" src="assets/chair.webp" alt="阅读椅"><img class="plant" src="assets/plant.webp" alt="窗边的绿植">
<section class="wall-calendar world-item" id="calendar" aria-label="墙上的签到日历"><button class="approach" data-focus="calendar">靠近墙上的日历 <span>↗</span></button><div class="surface"><div class="month">SEPTEMBER / 来过的日子</div><div id="calendar-days" class="calendar-days"></div><button id="stamp">盖下今天的印章</button><p id="stamp-info">演示奖励 3 糕点 · 每天一次</p></div></section>
<section class="writing-book world-item" id="book" aria-label="摊开的生活手账"><button class="approach" data-focus="book">坐下来，翻开手账 <span>↗</span></button><div class="book-spread surface"><div class="left-page"><span class="folio">我的生活，不需要评分</span><h2>今天，<br>想留下什么？</h2><p>让这一页成为生活的一小部分。</p><small id="book-date"></small></div><form class="right-page" id="room-form"><label for="room-text">直接写在这一页</label><textarea id="room-text" maxlength="300" placeholder="今天发生了一件小事……"></textarea><button type="submit">把这一页留下</button><span id="room-saved"></span></form></div></section>
<section class="memory-shelf world-item" id="shelf"><button class="approach" data-focus="shelf">走近我的经历架 <span>↗</span></button><div class="surface"><div class="shelf-label">每个故事，都留在这里</div><div id="keepsakes"></div><div class="shelf-reading" id="shelf-reading"><p>点一个物件，翻到它的背面</p></div></div></section>
<section class="account-ledger world-item" id="account"><button class="approach" data-focus="account">看看糕点小账本 <span>↗</span></button><div class="surface"><div class="account-label">糕点小账本 · 仅演示</div><strong id="room-balance"></strong><span>糕点</span><div id="room-ledger"></div><p>消费与经历分开保存。不单独售卖，不兑现现金。</p></div></section></div></div>
<a class="back-link" href="index.html">← 方向列表</a><div class="room-heading"><span>01 / APPROACH & INHABIT</span><h1>屋子一直，给你留着灯。</h1></div><button id="step-back" hidden>退回房间 <span>Esc</span></button><div class="room-corner"><button id="room-hints" aria-pressed="false">显示入口</button><button id="room-light">夜灯</button></div><p class="room-help" id="room-help">先点房间里的一个物件。靠近后，直接在它的表面操作。</p><div class="prototype-mark">桌面交互原型 · 浏览器本地保存</div><script src="world-core.js"></script><script src="room.js"></script></body></html>
